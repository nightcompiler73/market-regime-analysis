version: 2

models:
  - name: fct_market_regime
    description: Daily market regime classification model

    columns:
      - name: date
        tests:
          - unique
          - not_null

      - name: spy_close
        tests:
          - not_null

      - name: vix_close
        tests:
          - not_null

  - name: fct_market_prices
    columns:
      - name: date
        tests:
          - unique
          - not_null